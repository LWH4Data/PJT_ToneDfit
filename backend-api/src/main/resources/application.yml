spring:
  # 1. 애플리케이션 이름 설정
  application:
    name: tone-d-fit-dev

  config:
    # .env를 .env.properties 로 해석하여 가져오겠다는 뜻이다
    # optional을 붙여서 .env 파일이 있을 때만 들고오며, 없어도 컴파일 오류는 안난다
    import: optional:file:.env[.properties]

  # 2. 데이터 소스 (DataSource) 설정
  datasource:
    # JDBC URL: ${} 구문을 사용하여 환경 변수에서 값을 읽거나 (운영),
    # 로컬에서 실행 중인 컨테이너 주소를 직접 명시합니다.
    url: ${DB_URL}

    # 사용자 이름과 비밀번호도 환경 변수를 사용하거나 (권장),
    # 로컬 개발용 기본값을 지정합니다.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    # 사용할 JDBC 드라이버 클래스 지정 (PostgreSQL)
    driver-class-name: org.postgresql.Driver

  # 3. JPA (Hibernate) 설정
  jpa:
    hibernate:
      # db 테이블은 query 를 이용해 db 서버에서 직접 조작함
      ddl-auto: none
    properties:
      hibernate:
        # 콘솔에 SQL 쿼리 표시 (가독성 향상)
        format_sql: true

# 로깅 설정 (선택 사항)
logging:
  level:
    # 실행되는 SQL 쿼리를 'debug' 레벨로 출력
    org.hibernate.SQL: debug

# Actuator 설정 (spring과 동일한 최상위 레벨 키)
management:
  endpoints:
    web:
      exposure:
        # 웹(HTTP)을 통해 노출할 Actuator 엔드포인트를 명시합니다.
        # 'health', 'info', 'env', 'loggers', 'metrics', 'threaddump' 등 자주 사용하는 엔드포인트를 모두 포함합니다.
        # 개발 환경이므로 '*' (모두 노출)을 사용해도 무방합니다.
        include: health,info,env,loggers,metrics,threaddump
  endpoint:
    health:
      # health 엔드포인트에 접속할 때 인증 상태와 관계없이
      # DB 상태, 디스크 공간 등 모든 상세 정보를 항상(always) 표시하도록 설정합니다.
      show-details: always
#    shutdown:
#      # /actuator/shutdown 엔드포인트를 활성화합니다.
#      # POST 요청으로 서버를 빠르게 종료할 수 있어 개발 중 편리합니다.
#      # (운영 환경에서는 반드시 비활성화해야 합니다.)
#      enabled: true

# security 설정, authentication id, pw
security:
  admin:
    # Basic Authentication을 위한 관리자 ID입니다.
    username: ${AUTHENTICATION_USERNAME}
    # Basic Authentication을 위한 관리자 비밀번호입니다.
    # 실제 운영 환경에서는 Vault와 같은 외부 시크릿 매니저를 통해 관리되어야 합니다.
    password: ${AUTHENTICATION_PASSWORD}

# 서버 엔드포인트 접두사
server:
  servlet:
    context-path: /api

# 기상청 api 호출 키
weather:
  api:
    key: ${WEATHER_API_KEY}
    url: ${WEATHER_API_URL}

# jwt 기본 설정 추가
jwt:
  secret-key: ${JWT_SECURE_SECRET_KEY} # 최소 256bit 이상 (HS256 알고리즘 사용 시)
  authorities-key: ${JWT_AUTHORITIES_KEY}

# 시간 단위를 별도의 키로 정의
time:
  hour: ${TIME_HOUR}     # (예: 3600 초)
  day: ${TIME_DAY}       # (예: 86400 초)
  multiplier: ${TIME_MULTIPLIER}        # (예: 8 또는 7 배수)