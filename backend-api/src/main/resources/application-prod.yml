# 배포 환경에서 사용되는 설정 파일
# 컴포즈 시, application.yml 을 이파일로 오버라이드 합니다.

spring:
  # 1. 애플리케이션 이름 설정
  application:
    name: tone-d-fit-dev

  # 2. 데이터 소스 (DataSource) 설정
  datasource:
    # JDBC URL: ${} 구문을 사용하여 환경 변수에서 값을 읽거나 (운영),
    # 로컬에서 실행 중인 컨테이너 주소를 직접 명시합니다.
    url: ${POSTGRES_URL}

    # 사용자 이름과 비밀번호도 환경 변수를 사용하거나 (권장),
    # 로컬 개발용 기본값을 지정합니다.
    username: ${POSTGRES_USER_NAME}
    password: ${POSTGRES_PASSWORD_SECRET}

    # 사용할 JDBC 드라이버 클래스 지정 (PostgreSQL)
    driver-class-name: org.postgresql.Driver

  # 3. JPA (Hibernate) 설정
  jpa:
    hibernate:
      # db 테이블은 query 를 이용해 db 서버에서 직접 조작함
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 콘솔에 SQL 쿼리 표시 (가독성 향상)
        format_sql: true

# 4. 로깅 설정 (선택 사항)
logging:
  level:
    # 실행되는 SQL 쿼리를 'debug' 레벨로 출력
    org.hibernate.SQL: debug

# 5. Actuator 설정
management:
  endpoints:
    web:
      exposure:
        # 개발 환경이므로 '*' (모두 노출)을 사용해도 무방합니다.
        # 배포시 엔드포인트 제한 고려할 것.
        include: health,info,env,loggers,metrics,threaddump
  endpoint:
    health:
      # health 엔드포인트에 접속할 때 인증 상태와 관계없이
      # DB 상태, 디스크 공간 등 모든 상세 정보를 항상(always) 표시하도록 설정합니다.
      show-details: always

# 6. Authenticatioin 요구시 사용하게 되는 접근 권한 변수입니다.
security:
  admin:
    # Basic Authentication을 위한 관리자 ID입니다.
    username: ${AUTHENTICATION_USERNAME}
    # Basic Authentication을 위한 관리자 비밀번호입니다.
    # 실제 운영 환경에서는 Vault와 같은 외부 시크릿 매니저를 통해 관리되어야 합니다.
    password: ${AUTHENTICATION_PASSWORD}

# 7. api 요청에 대응하는 가장 기본적인 엔드포인트를 지정합니다.
server:
  servlet:
    context-path: /api

# 8. 실시간 날씨 api 호출을 위한 url 경로와 기상청 api 키입니다.
weather:
  api:
    key: ${WEATHER_API_KEY}
    url: ${WEATHER_API_URL}

# 9. jwt 필터를 이용하기 위한 설정값입니다.
jwt:
  secret-key: ${JWT_SECURE_SECRET_KEY} # 최소 256bit 이상 (HS256 알고리즘 사용 시)
  authorities-key: ${JWT_AUTHORITIES_KEY}
# 9 - 1. jwt token 만료시간 설정을 위한 정적 시간 변수입니다.
time:
  hour: ${TIME_HOUR}     # (예: 3600 초)
  day: ${TIME_DAY}       # (예: 86400 초)
  multiplier: ${TIME_MULTIPLIER}        # (예: 8 또는 7 배수)