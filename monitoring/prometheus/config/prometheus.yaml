global:
  scrape_interval: 15s
  scrape_timeout: 15s
  evaluation_interval: 2m
  external_labels:
    monitor: 'codelab-monitor'
  query_log_file: /prometheus/query.log

rule_files:
  - "rule.yaml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
    
  - job_name: 'node-local'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          alias: 'service'               # NOTE: Grafana에 깔끔히 보이도록 별칭 부여
    relabel_configs:
      - source_labels: [alias]
        target_label: instance            # NOTE: alias 값을 instance 라벨로 덮어쓰기

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

