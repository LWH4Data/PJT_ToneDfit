Configuration:
  status: warn
  Appenders:
    RollingFile:
      name: KAFKA_FILE
      fileName: /var/log/kafka/server.log
      filePattern: /var/log/kafka/server-%d{yyyy-MM-dd}-%i.log.gz
      PatternLayout:
        pattern: "%d{ISO8601} [%t] %-5level %logger - %msg%n"
      Policies:
        SizeBasedTriggeringPolicy:
          size: 20MB
        TimeBasedTriggeringPolicy:
          interval: 1
      DefaultRolloverStrategy:
        max: 10
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{ISO8601} %-5p %c - %m%n"
  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: KAFKA_FILE
        - ref: STDOUT
