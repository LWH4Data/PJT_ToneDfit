# SSH 터널 전제. 컨테이너 내부 포트는 열어두되, 호스트 바인딩은 127.0.0.1로 제한됨
listen_addresses = '*'
port = 5432

# 메모리/동시성 (EC2 사양에 맞게 조정)
max_connections = 200
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 256MB
effective_cache_size = 2GB

# 타임존/로깅
timezone = 'Asia/Seoul'
logging_collector = on
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000

# WAL/체크포인트 기본값 (워크로드 맞춰 조정)
wal_level = replica
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 256MB
